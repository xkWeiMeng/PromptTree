<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 2778">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
  </defs>

  <!-- 全屏渐变背景 -->
  <rect width="1284" height="2778" fill="url(#bg)"/>

  <!-- 居中品牌图标 -->
  <g transform="translate(442, 1089)">
    <!-- 树干 + 分支 -->
    <path d="M140 100 L140 400 M140 160 L220 160 M140 270 L220 270 M140 380 L220 380"
          stroke="white" stroke-opacity="0.9" stroke-width="24" stroke-linecap="round" fill="none"/>
    <!-- 根节点 -->
    <circle cx="140" cy="100" r="20" fill="#ffffff"/>
    <!-- 节点 -->
    <rect x="230" y="142" width="120" height="36" rx="8" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="230" y="252" width="150" height="36" rx="8" fill="#ffffff"/>
    <rect x="230" y="362" width="100" height="36" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  </g>

  <!-- 品牌名 -->
  <text x="642" y="1620" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="56" font-weight="600" fill="white" fill-opacity="0.9">PromptTree</text>
</svg>
